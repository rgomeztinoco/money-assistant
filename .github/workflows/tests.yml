name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: '5432'
  DB_DATABASE: testing
  DB_USERNAME: sail
  DB_PASSWORD: password

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Configure application
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate application key
        run: php artisan key:generate --force --no-interaction

      - name: Run fresh PostgreSQL migrations
        run: php artisan migrate:fresh --force --no-interaction

      - name: Build frontend assets
        run: npm run build

      - name: Run feature Pest suite
        run: php artisan test --compact tests/Feature

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser Pest suite
        run: php artisan test --compact tests/Browser

      - name: Run Pint
        run: vendor/bin/pint --test --format agent

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run TypeScript checks
        run: npm run types:check

      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier
        run: npm run format:check

  production-stack:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Configure application
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate --force --no-interaction

      - name: Run focused infrastructure tests
        run: php artisan test --compact tests/Feature/Infrastructure/ProductionStackTest.php tests/Feature/Infrastructure/BackupRecoveryTest.php
