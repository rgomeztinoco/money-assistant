name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Configure application
        run: cp .env.example .env

      - name: Start Sail
        run: vendor/bin/sail up -d --wait

      - name: Install application dependencies
        run: |
          vendor/bin/sail composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/sail npm ci --no-audit --no-fund

      - name: Generate application key
        run: vendor/bin/sail artisan key:generate --force --no-interaction

      - name: Run fresh PostgreSQL migrations
        run: vendor/bin/sail artisan migrate:fresh --force --no-interaction

      - name: Build frontend assets
        run: vendor/bin/sail npm run build

      - name: Run feature Pest suite
        run: vendor/bin/sail artisan test --compact tests/Feature

      - name: Install Playwright browser
        run: vendor/bin/sail root-shell -c 'npx playwright install --with-deps chromium'

      - name: Run browser Pest suite
        run: vendor/bin/sail artisan test --compact tests/Browser

      - name: Run Pint
        run: vendor/bin/sail bin pint --test --format agent

      - name: Run Larastan
        run: vendor/bin/sail bin phpstan analyse --no-progress

      - name: Run TypeScript checks
        run: vendor/bin/sail npm run types:check

      - name: Run ESLint
        run: vendor/bin/sail npm run lint:check

      - name: Run Prettier
        run: vendor/bin/sail npm run format:check

  production-stack:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Configure application
        run: cp .env.example .env

      - name: Start Sail
        run: vendor/bin/sail up -d --wait

      - name: Run focused infrastructure tests
        run: vendor/bin/sail artisan test --compact tests/Feature/Infrastructure/ProductionStackTest.php tests/Feature/Infrastructure/BackupRecoveryTest.php
