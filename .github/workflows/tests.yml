name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        # The project-local Sail binary is unavailable until this bootstrap install completes.
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Configure Application
        run: cp .env.example .env

      - name: Start Sail
        run: vendor/bin/sail up -d --wait

      - name: Setup Application
        run: vendor/bin/sail composer setup

      - name: Install Playwright system dependencies
        run: vendor/bin/sail root-shell -c 'npx playwright install-deps chromium'

      - name: Install Playwright browser
        run: vendor/bin/sail npx playwright install chromium

      - name: Run CI Checks
        run: vendor/bin/sail composer ci:check

  production-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Configure development rehearsal
        run: cp .env.example .env

      - name: Build rehearsal application images
        run: |
          docker run \
            --detach \
            --name money-assistant-rehearsal-registry \
            --publish 127.0.0.1:5000:5000 \
            registry:3@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null; then
              break
            fi

            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null

          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag localhost:5000/money-assistant:healthy \
            .
          docker push localhost:5000/money-assistant:healthy

          healthy_image="$(docker image inspect localhost:5000/money-assistant:healthy --format '{{index .RepoDigests 0}}')"
          build_rehearsal_candidate()
          {
            candidate_tag="$1"
            migration_file="$2"
            candidate_health="$3"

            {
              printf 'FROM %s\n' "$healthy_image"
              printf 'COPY --chown=www-data:www-data database/deployment-rehearsal/%s /app/database/migrations/%s\n' \
                "$migration_file" "$migration_file"
              if [ "$candidate_health" = unhealthy ]; then
                printf "RUN printf ':8080 { respond 503 }\\\\n' > /etc/frankenphp/Caddyfile\n"
              fi
            } | docker build --file - --tag "localhost:5000/money-assistant:${candidate_tag}" . >&2

            docker push "localhost:5000/money-assistant:${candidate_tag}" >/dev/null
            docker image inspect \
              "localhost:5000/money-assistant:${candidate_tag}" \
              --format '{{index .RepoDigests 0}}'
          }

          successful_image="$(build_rehearsal_candidate \
            successful \
            2026_08_08_141735_rehearse_successful_transactional_deployment.php \
            healthy)"
          failed_migration_image="$(build_rehearsal_candidate \
            failed-migration \
            2026_08_08_141736_rehearse_failed_transactional_migration.php \
            healthy)"
          failed_health_image="$(build_rehearsal_candidate \
            failed-health \
            2026_08_08_141737_rehearse_unhealthy_transactional_deployment.php \
            unhealthy)"
          concurrent_image="$(build_rehearsal_candidate \
            concurrent \
            2026_08_08_141738_rehearse_concurrent_transactional_deployment.php \
            healthy)"
          operational_bundle=/tmp/money-assistant-operational-bundle.tar
          operational_bundle_checksum="$(./build-operational-bundle "$GITHUB_SHA" "$operational_bundle")"

          {
            echo "APP_IMAGE_PULL_POLICY=never"
            echo "POSTGRES_IMAGE=postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e"
            echo "POSTGRES_IMAGE_PULL_POLICY=never"
            echo "PRIVATE_HOSTNAME=money-assistant.test"
            echo "GOOGLE_GMAIL_CLIENT_SECRET_FILE=/tmp/money-assistant-production-smoke/google_gmail_client_secret"
            echo "OPENCLAW_CAPABILITY_KEY_ID=openclaw-service-ci"
            echo "OPENCLAW_CAPABILITY_AGENT_ID=money-assistant-ci"
            echo "OPENCLAW_CAPABILITY_ACCOUNT_ID=money-assistant-owner-ci"
            echo "OPENCLAW_CAPABILITY_CONVERSATION_ID=ci-owner-conversation"
            echo "OPENCLAW_CAPABILITY_OWNER_SENDER_ID=ci-owner"
            echo "OPENCLAW_CAPABILITY_PUBLIC_KEY_FILE=/tmp/money-assistant-production-smoke/openclaw_capability_public_key"
            echo "OPENCLAW_HOOK_TOKEN_FILE=/tmp/money-assistant-production-smoke/openclaw_hook_token"
            echo "OPENCLAW_HOOK_URL=http://127.0.0.1:19789/hooks/money-assistant"
            echo "OPENCLAW_VERSION=2026.7.1"
            echo "APP_KEY_FILE=/tmp/money-assistant-production-smoke/application_key"
            echo "APP_PREVIOUS_KEYS_FILE=/tmp/money-assistant-production-smoke/application_previous_keys"
            echo "DB_PASSWORD_FILE=/tmp/money-assistant-production-smoke/database_password"
            echo "COMPOSE_PROJECT_NAME=money-assistant-production-smoke"
            echo "DEPLOYMENT_STATE_DIRECTORY=/tmp/money-assistant-production-smoke/deployments"
            echo "DEPLOYMENT_ALERT_COMMAND=/tmp/money-assistant-production-smoke/capture-deployment-alert"
            echo "DEPLOYMENT_ALERT_LOG=/tmp/money-assistant-production-smoke/deployment-alerts.log"
            echo "PRODUCTION_ENV_FILE=/tmp/money-assistant-production-smoke/production.env"
            echo "GOOD_APP_IMAGE=$healthy_image"
            echo "SUCCESSFUL_APP_IMAGE=$successful_image"
            echo "FAILED_MIGRATION_APP_IMAGE=$failed_migration_image"
            echo "FAILED_HEALTH_APP_IMAGE=$failed_health_image"
            echo "CONCURRENT_APP_IMAGE=$concurrent_image"
            echo "REHEARSAL_OUTPUT=/tmp/money-assistant-production-smoke/rehearsal-output.log"
            echo "OPERATIONAL_BUNDLE=$operational_bundle"
            echo "OPERATIONAL_BUNDLE_CHECKSUM=$operational_bundle_checksum"
            echo "OPERATIONAL_BUNDLE_ROOT=/tmp/money-assistant-production-smoke/operational-bundles"
          } >> "$GITHUB_ENV"

      - name: Create isolated rehearsal configuration
        run: |
          install -d -m 0700 /tmp/money-assistant-production-smoke
          printf 'base64:%s\n' "$(openssl rand -base64 32)" |
            tee /tmp/money-assistant-production-smoke/application_key >/dev/null
          : > /tmp/money-assistant-production-smoke/application_previous_keys
          openssl rand -base64 32 |
            tee /tmp/money-assistant-production-smoke/database_password >/dev/null
          openssl rand -base64 32 |
            tee /tmp/money-assistant-production-smoke/google_gmail_client_secret >/dev/null
          openssl rand -base64 32 |
            tee /tmp/money-assistant-production-smoke/openclaw_capability_public_key >/dev/null
          openssl rand -base64 32 |
            tee /tmp/money-assistant-production-smoke/openclaw_hook_token >/dev/null
          chmod 0600 /tmp/money-assistant-production-smoke/application_key
          chmod 0600 /tmp/money-assistant-production-smoke/application_previous_keys
          chmod 0600 /tmp/money-assistant-production-smoke/database_password
          chmod 0600 /tmp/money-assistant-production-smoke/google_gmail_client_secret
          chmod 0600 /tmp/money-assistant-production-smoke/openclaw_capability_public_key
          chmod 0600 /tmp/money-assistant-production-smoke/openclaw_hook_token
          : > "$DEPLOYMENT_ALERT_LOG"
          chmod 0600 "$DEPLOYMENT_ALERT_LOG"
          install -m 0700 /dev/stdin "$DEPLOYMENT_ALERT_COMMAND" <<'SH'
          #!/bin/sh
          set -eu
          printf '%s\n' "$1" >> "${DEPLOYMENT_ALERT_LOG:?Set DEPLOYMENT_ALERT_LOG}"
          SH

          for secret_file in \
            "$APP_KEY_FILE" \
            "$DB_PASSWORD_FILE" \
            "$GOOGLE_GMAIL_CLIENT_SECRET_FILE" \
            "$OPENCLAW_CAPABILITY_PUBLIC_KEY_FILE" \
            "$OPENCLAW_HOOK_TOKEN_FILE"; do
            printf '::add-mask::%s\n' "$(tr -d '\r\n' < "$secret_file")"
          done

          sudo chown root:root \
            "$APP_KEY_FILE" \
            "$APP_PREVIOUS_KEYS_FILE" \
            "$DB_PASSWORD_FILE" \
            "$GOOGLE_GMAIL_CLIENT_SECRET_FILE" \
            "$OPENCLAW_CAPABILITY_PUBLIC_KEY_FILE" \
            "$OPENCLAW_HOOK_TOKEN_FILE"

          healthy_repository="${GOOD_APP_IMAGE%@*}"
          healthy_digest="${GOOD_APP_IMAGE##*@}"

          {
            echo "APP_IMAGE_REPOSITORY=$healthy_repository"
            echo "APP_IMAGE_DIGEST=$healthy_digest"
            echo "APP_IMAGE_PULL_POLICY=never"
            echo "POSTGRES_IMAGE=$POSTGRES_IMAGE"
            echo "POSTGRES_IMAGE_PULL_POLICY=never"
            echo "PRIVATE_HOSTNAME=$PRIVATE_HOSTNAME"
            echo "GOOGLE_GMAIL_CLIENT_ID=ci-rehearsal-client"
            echo "GOOGLE_GMAIL_CLIENT_SECRET_FILE=$GOOGLE_GMAIL_CLIENT_SECRET_FILE"
            echo "OPENCLAW_CAPABILITY_KEY_ID=$OPENCLAW_CAPABILITY_KEY_ID"
            echo "OPENCLAW_CAPABILITY_AGENT_ID=$OPENCLAW_CAPABILITY_AGENT_ID"
            echo "OPENCLAW_CAPABILITY_ACCOUNT_ID=$OPENCLAW_CAPABILITY_ACCOUNT_ID"
            echo "OPENCLAW_CAPABILITY_CONVERSATION_ID=$OPENCLAW_CAPABILITY_CONVERSATION_ID"
            echo "OPENCLAW_CAPABILITY_OWNER_SENDER_ID=$OPENCLAW_CAPABILITY_OWNER_SENDER_ID"
            echo "OPENCLAW_CAPABILITY_PUBLIC_KEY_FILE=$OPENCLAW_CAPABILITY_PUBLIC_KEY_FILE"
            echo "OPENCLAW_HOOK_TOKEN_FILE=$OPENCLAW_HOOK_TOKEN_FILE"
            echo "OPENCLAW_HOOK_URL=$OPENCLAW_HOOK_URL"
            echo "OPENCLAW_VERSION=$OPENCLAW_VERSION"
            echo "APP_KEY_FILE=$APP_KEY_FILE"
            echo "APP_PREVIOUS_KEYS_FILE=$APP_PREVIOUS_KEYS_FILE"
            echo "DB_PASSWORD_FILE=$DB_PASSWORD_FILE"
          } > "$PRODUCTION_ENV_FILE"
          chmod 0600 "$PRODUCTION_ENV_FILE"

      - name: Deploy healthy production stack
        run: |
          exec 3>&1
          exec > "$REHEARSAL_OUTPUT" 2>&1

          if ./activate-production-release validate \
            --source-revision "$GITHUB_SHA" \
            --bundle-checksum "$(printf '%064d' 0)" \
            --bundle "$OPERATIONAL_BUNDLE" \
            --app-image "$GOOD_APP_IMAGE"; then
            echo 'A mismatched operational bundle checksum was unexpectedly accepted.' >&2
            exit 1
          fi
          test ! -e "$DEPLOYMENT_STATE_DIRECTORY/current.json"

          ./activate-production-release deploy \
            --source-revision "$GITHUB_SHA" \
            --bundle-checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
            --bundle "$OPERATIONAL_BUNDLE" \
            --env-file "$PRODUCTION_ENV_FILE" \
            --app-image "$GOOD_APP_IMAGE"

          jq -e \
            --arg application_image "$GOOD_APP_IMAGE" \
            --arg database_image "$POSTGRES_IMAGE" \
            --arg operational_bundle_checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
            '.outcome == "deployed" and .application_image == $application_image and .database_image == $database_image and .operational_bundle_checksum == $operational_bundle_checksum' \
            "$DEPLOYMENT_STATE_DIRECTORY/current.json"
          test "$(stat --format '%a' "$DEPLOYMENT_STATE_DIRECTORY/current.json")" = 600
          printf '%s\n' 'Healthy digest deployment and metadata verification passed.' >&3

      - name: Rehearse development and production coexistence
        run: |
          production_container_ids()
          {
            docker compose \
              --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file "$PRODUCTION_ENV_FILE" \
              --file compose.production.yaml \
              ps --quiet postgres web worker scheduler proxy | sort
          }

          production_migration_fingerprint()
          {
            docker compose \
              --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file "$PRODUCTION_ENV_FILE" \
              --file compose.production.yaml \
              exec --no-TTY web \
              /usr/local/bin/with-production-secrets \
              php artisan migrate:status --no-ansi --no-interaction | sha256sum
          }

          production_container_ids_before="$(production_container_ids)"
          production_migrations_before="$(production_migration_fingerprint)"

          assert_production_unchanged()
          {
            production_container_ids_after="$(production_container_ids)"
            production_migrations_after="$(production_migration_fingerprint)"

            test "$production_container_ids_after" = "$production_container_ids_before"
            test "$production_migrations_after" = "$production_migrations_before"
            docker network inspect "${COMPOSE_PROJECT_NAME}_application" >/dev/null
            docker volume inspect "${COMPOSE_PROJECT_NAME}_postgres-data" >/dev/null
          }

          COMPOSE_PROJECT_NAME=money-assistant-development vendor/bin/sail up -d --wait
          test "$(COMPOSE_PROJECT_NAME=money-assistant-development vendor/bin/sail ps --services --status running | sort)" = "$(printf '%s\n' laravel.test mailpit pgsql | sort)"
          COMPOSE_PROJECT_NAME=money-assistant-development vendor/bin/sail artisan migrate --force
          assert_production_unchanged

          COMPOSE_PROJECT_NAME=money-assistant-development vendor/bin/sail stop
          assert_production_unchanged

          COMPOSE_PROJECT_NAME=money-assistant-development vendor/bin/sail up -d --wait
          COMPOSE_PROJECT_NAME=money-assistant-development vendor/bin/sail down --volumes --remove-orphans
          assert_production_unchanged

      - name: Rehearse restart recovery
        run: |
          exec 3>&1
          exec >> "$REHEARSAL_OUTPUT" 2>&1

          rehearsal_id="$(< /proc/sys/kernel/random/uuid)"
          echo "REHEARSAL_ID=$rehearsal_id" >> "$GITHUB_ENV"

          docker compose \
            --env-file "$PRODUCTION_ENV_FILE" \
            --file compose.production.yaml \
            stop worker scheduler

          docker compose \
            --env-file "$PRODUCTION_ENV_FILE" \
            --file compose.production.yaml \
            exec --no-TTY web \
            /usr/local/bin/with-production-secrets \
            php artisan app:deployment-rehearsal:prepare "$rehearsal_id" --no-interaction

          docker compose \
            --env-file "$PRODUCTION_ENV_FILE" \
            --file compose.production.yaml \
            stop

          docker compose \
            --env-file "$PRODUCTION_ENV_FILE" \
            --file compose.production.yaml \
            up --detach --wait --pull never

          for attempt in $(seq 1 30); do
            if docker compose \
              --env-file "$PRODUCTION_ENV_FILE" \
              --file compose.production.yaml \
              exec --no-TTY web \
              /usr/local/bin/with-production-secrets \
              php artisan app:deployment-rehearsal:verify "$rehearsal_id" --no-interaction; then
              printf '%s\n' 'Queued and scheduled probes survived the stack restart.' >&3
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: Rehearse successful transactional deployment
        run: |
          exec 3>&1
          exec >> "$REHEARSAL_OUTPUT" 2>&1

          docker compose \
            --env-file "$PRODUCTION_ENV_FILE" \
            --file compose.production.yaml \
            stop worker scheduler

          successful_rehearsal_id="$(< /proc/sys/kernel/random/uuid)"
          docker compose \
            --env-file "$PRODUCTION_ENV_FILE" \
            --file compose.production.yaml \
            exec --no-TTY web \
            /usr/local/bin/with-production-secrets \
            php artisan app:deployment-rehearsal:prepare "$successful_rehearsal_id" --no-interaction

          : > "$DEPLOYMENT_ALERT_LOG"
          deployment_started_at="$(date +%s)"
          ./activate-production-release deploy \
            --source-revision "$GITHUB_SHA" \
            --bundle-checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
            --bundle "$OPERATIONAL_BUNDLE" \
            --env-file "$PRODUCTION_ENV_FILE" \
            --app-image "$SUCCESSFUL_APP_IMAGE"
          maintenance_seconds=$(($(date +%s) - deployment_started_at))
          test "$maintenance_seconds" -lt 300
          test ! -s "$DEPLOYMENT_ALERT_LOG"

          jq -e \
            --arg application_image "$SUCCESSFUL_APP_IMAGE" \
            '.outcome == "deployed" and .application_image == $application_image and .maintenance_seconds < 300' \
            "$DEPLOYMENT_STATE_DIRECTORY/current.json"

          migration_name=2026_08_08_141735_rehearse_successful_transactional_deployment
          migration_count="$(docker compose \
            --env-file "$PRODUCTION_ENV_FILE" \
            --file compose.production.yaml \
            exec --no-TTY postgres \
            psql --username money_assistant --dbname money_assistant --tuples-only --no-align \
            --command "SELECT count(*) FROM migrations WHERE migration = '${migration_name}'")"
          test "$migration_count" = 1

          web_container_id="$(docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml ps --quiet web)"
          web_healthy_at="$(docker inspect "$web_container_id" --format '{{range .State.Health.Log}}{{if eq .ExitCode 0}}{{.End}}{{"\\n"}}{{end}}{{end}}' | head -n 1)"
          test -n "$web_healthy_at"
          for service in worker scheduler; do
            container_id="$(docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml ps --quiet "$service")"
            started_at="$(docker inspect "$container_id" --format '{{.State.StartedAt}}')"
            test "$started_at" \> "$web_healthy_at"
          done

          for attempt in $(seq 1 30); do
            if docker compose \
              --env-file "$PRODUCTION_ENV_FILE" \
              --file compose.production.yaml \
              exec --no-TTY web \
              /usr/local/bin/with-production-secrets \
              php artisan app:deployment-rehearsal:verify "$successful_rehearsal_id" --no-interaction; then
              printf '%s\n' 'Successful transaction, activation order, timing, and durable work passed.' >&3
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: Rehearse failed migration restoration
        run: |
          exec 3>&1
          exec >> "$REHEARSAL_OUTPUT" 2>&1

          docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml stop worker scheduler
          rehearsal_id="$(< /proc/sys/kernel/random/uuid)"
          docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml exec --no-TTY web \
            /usr/local/bin/with-production-secrets \
            php artisan app:deployment-rehearsal:prepare "$rehearsal_id" --no-interaction
          financial_state_before="$(docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml exec --no-TTY web \
            /usr/local/bin/with-production-secrets php artisan app:financial-state:fingerprint --no-interaction)"
          : > "$DEPLOYMENT_ALERT_LOG"

          if ./activate-production-release deploy \
            --source-revision "$GITHUB_SHA" \
            --bundle-checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
            --bundle "$OPERATIONAL_BUNDLE" \
            --env-file "$PRODUCTION_ENV_FILE" \
            --app-image "$FAILED_MIGRATION_APP_IMAGE"; then
            echo 'The deliberately failing migration unexpectedly succeeded.' >&2
            exit 1
          fi

          jq -e \
            --arg application_image "$SUCCESSFUL_APP_IMAGE" \
            --arg attempted_application_image "$FAILED_MIGRATION_APP_IMAGE" \
            '.outcome == "rolled_back" and .application_image == $application_image and .attempted_application_image == $attempted_application_image' \
            "$DEPLOYMENT_STATE_DIRECTORY/current.json"
          expected_image_id="$(docker image inspect "$SUCCESSFUL_APP_IMAGE" --format '{{.Id}}')"
          for service in web worker scheduler; do
            container_id="$(docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml ps --quiet "$service")"
            test "$(docker inspect "$container_id" --format '{{.Image}}')" = "$expected_image_id"
          done
          financial_state_after="$(docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml exec --no-TTY web \
            /usr/local/bin/with-production-secrets php artisan app:financial-state:fingerprint --no-interaction)"
          test "$financial_state_after" = "$financial_state_before"
          test "$(grep -c 'Production deployment failed' "$DEPLOYMENT_ALERT_LOG")" = 1
          test "$(grep -c 'Production deployment recovered' "$DEPLOYMENT_ALERT_LOG")" = 1
          test "$(wc -l < "$DEPLOYMENT_ALERT_LOG")" = 2
          durable_work_restored=false
          for attempt in $(seq 1 30); do
            if docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml exec --no-TTY web \
              /usr/local/bin/with-production-secrets \
              php artisan app:deployment-rehearsal:verify "$rehearsal_id" --no-interaction; then
              durable_work_restored=true
              break
            fi
            sleep 2
          done
          test "$durable_work_restored" = true

          printf '%s\n' 'Failed migration restored financial state, image, alerts, and durable work.' >&3

      - name: Rehearse failed health restoration
        run: |
          exec 3>&1
          exec >> "$REHEARSAL_OUTPUT" 2>&1

          docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml stop worker scheduler
          rehearsal_id="$(< /proc/sys/kernel/random/uuid)"
          docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml exec --no-TTY web \
            /usr/local/bin/with-production-secrets \
            php artisan app:deployment-rehearsal:prepare "$rehearsal_id" --no-interaction
          financial_state_before="$(docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml exec --no-TTY web \
            /usr/local/bin/with-production-secrets php artisan app:financial-state:fingerprint --no-interaction)"
          : > "$DEPLOYMENT_ALERT_LOG"

          if ./activate-production-release deploy \
            --source-revision "$GITHUB_SHA" \
            --bundle-checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
            --bundle "$OPERATIONAL_BUNDLE" \
            --env-file "$PRODUCTION_ENV_FILE" \
            --app-image "$FAILED_HEALTH_APP_IMAGE"; then
            echo 'The deliberately unhealthy candidate unexpectedly succeeded.' >&2
            exit 1
          fi

          jq -e \
            --arg application_image "$SUCCESSFUL_APP_IMAGE" \
            --arg attempted_application_image "$FAILED_HEALTH_APP_IMAGE" \
            '.outcome == "rolled_back" and .application_image == $application_image and .attempted_application_image == $attempted_application_image' \
            "$DEPLOYMENT_STATE_DIRECTORY/current.json"
          expected_image_id="$(docker image inspect "$SUCCESSFUL_APP_IMAGE" --format '{{.Id}}')"
          for service in web worker scheduler; do
            container_id="$(docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml ps --quiet "$service")"
            test "$(docker inspect "$container_id" --format '{{.Image}}')" = "$expected_image_id"
          done
          financial_state_after="$(docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml exec --no-TTY web \
            /usr/local/bin/with-production-secrets php artisan app:financial-state:fingerprint --no-interaction)"
          test "$financial_state_after" = "$financial_state_before"
          test "$(grep -c 'Production deployment failed' "$DEPLOYMENT_ALERT_LOG")" = 1
          test "$(grep -c 'Production deployment recovered' "$DEPLOYMENT_ALERT_LOG")" = 1
          test "$(wc -l < "$DEPLOYMENT_ALERT_LOG")" = 2
          durable_work_restored=false
          for attempt in $(seq 1 30); do
            if docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml exec --no-TTY web \
              /usr/local/bin/with-production-secrets \
              php artisan app:deployment-rehearsal:verify "$rehearsal_id" --no-interaction; then
              durable_work_restored=true
              break
            fi
            sleep 2
          done
          test "$durable_work_restored" = true

          printf '%s\n' 'Failed health restored financial state, image, alerts, and durable work.' >&3

      - name: Rehearse concurrent deployment exclusion
        run: |
          exec 3>&1
          exec >> "$REHEARSAL_OUTPUT" 2>&1

          : > "$DEPLOYMENT_ALERT_LOG"
          ./activate-production-release deploy \
            --source-revision "$GITHUB_SHA" \
            --bundle-checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
            --bundle "$OPERATIONAL_BUNDLE" \
            --env-file "$PRODUCTION_ENV_FILE" \
            --app-image "$CONCURRENT_APP_IMAGE" &
          first_deployment_pid=$!

          for attempt in $(seq 1 50); do
            if ! flock --nonblock "$DEPLOYMENT_STATE_DIRECTORY/deployment.lock" true; then
              break
            fi
            sleep 0.2
          done

          if ./activate-production-release deploy \
            --source-revision "$GITHUB_SHA" \
            --bundle-checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
            --bundle "$OPERATIONAL_BUNDLE" \
            --env-file "$PRODUCTION_ENV_FILE" \
            --app-image "$CONCURRENT_APP_IMAGE"; then
            echo 'A concurrent deployment unexpectedly acquired the release lock.' >&2
            exit 1
          fi
          wait "$first_deployment_pid"
          test ! -s "$DEPLOYMENT_ALERT_LOG"

          migration_name=2026_08_08_141738_rehearse_concurrent_transactional_deployment
          migration_count="$(docker compose --env-file "$PRODUCTION_ENV_FILE" --file compose.production.yaml exec --no-TTY postgres \
            psql --username money_assistant --dbname money_assistant --tuples-only --no-align \
            --command "SELECT count(*) FROM migrations WHERE migration = '${migration_name}'")"
          test "$migration_count" = 1
          jq -e --arg application_image "$CONCURRENT_APP_IMAGE" \
            '.outcome == "deployed" and .application_image == $application_image' \
            "$DEPLOYMENT_STATE_DIRECTORY/current.json"

          printf '%s\n' 'Concurrent migration and activation were excluded by the deployment lock.' >&3

      - name: Rehearse interrupted bundle activation convergence
        run: |
          exec 3>&1
          exec >> "$REHEARSAL_OUTPUT" 2>&1

          for phase in staged candidate_verified bundle_activation_pending bundle_activated committed; do
            ./activate-production-release deploy \
              --source-revision "$GITHUB_SHA" \
              --bundle-checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
              --bundle "$OPERATIONAL_BUNDLE" \
              --env-file "$PRODUCTION_ENV_FILE" \
              --app-image "$CONCURRENT_APP_IMAGE" &
            interrupted_pid=$!
            for attempt in $(seq 1 200); do
              if grep -Fxq "phase=$phase" "$DEPLOYMENT_STATE_DIRECTORY/transaction.state" 2>/dev/null; then
                break
              fi
              sleep 0.05
            done
            grep -Fxq "phase=$phase" "$DEPLOYMENT_STATE_DIRECTORY/transaction.state"
            kill -KILL "$interrupted_pid"
            wait "$interrupted_pid" || true

            ./activate-production-release deploy \
              --source-revision "$GITHUB_SHA" \
              --bundle-checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
              --bundle "$OPERATIONAL_BUNDLE" \
              --env-file "$PRODUCTION_ENV_FILE" \
              --app-image "$CONCURRENT_APP_IMAGE"
            jq -e \
              --arg application_image "$CONCURRENT_APP_IMAGE" \
              --arg operational_bundle_checksum "$OPERATIONAL_BUNDLE_CHECKSUM" \
              '.outcome == "deployed" and .application_image == $application_image and .operational_bundle_checksum == $operational_bundle_checksum' \
              "$DEPLOYMENT_STATE_DIRECTORY/current.json"
          done

          printf '%s\n' 'Interrupted activation converged on a verified release or paired restoration.' >&3

      - name: Verify production rehearsal secret isolation
        run: |
          exec 3>&1
          exec >> "$REHEARSAL_OUTPUT" 2>&1

          ./deploy-production verify --env-file "$PRODUCTION_ENV_FILE"

          docker compose \
            --env-file "$PRODUCTION_ENV_FILE" \
            --file compose.production.yaml \
            logs --no-color postgres web worker scheduler proxy

          for secret_file in \
            "$APP_KEY_FILE" \
            "$APP_PREVIOUS_KEYS_FILE" \
            "$DB_PASSWORD_FILE" \
            "$GOOGLE_GMAIL_CLIENT_SECRET_FILE" \
            "$OPENCLAW_CAPABILITY_PUBLIC_KEY_FILE" \
            "$OPENCLAW_HOOK_TOKEN_FILE"; do
            if sudo grep --quiet --fixed-strings --file "$secret_file" "$REHEARSAL_OUTPUT"; then
              printf 'A rehearsal credential was exposed from %s.\n' "$secret_file" >&3
              exit 1
            fi
          done

          printf '%s\n' 'Complete deployment, migration, rollback, and container logs contain no rehearsal secrets.' >&3

      - name: Report production rehearsal failure
        if: failure()
        run: |
          if [ -f "${REHEARSAL_OUTPUT:-}" ]; then
            cat "$REHEARSAL_OUTPUT"
          fi

          if [ -f "${PRODUCTION_ENV_FILE:-}" ]; then
            docker compose \
              --env-file "$PRODUCTION_ENV_FILE" \
              --file compose.production.yaml \
              ps --all || true
            docker compose \
              --env-file "$PRODUCTION_ENV_FILE" \
              --file compose.production.yaml \
              logs --no-color postgres migrate web worker scheduler proxy || true
          fi

      - name: Stop production stack
        if: always()
        run: |
          COMPOSE_PROJECT_NAME=money-assistant-development vendor/bin/sail down --volumes --remove-orphans || true
          if [ -f /tmp/money-assistant-production-smoke/production.env ]; then
            docker compose \
              --env-file /tmp/money-assistant-production-smoke/production.env \
              --file compose.production.yaml \
              down --volumes --remove-orphans
          fi
          docker rm --force money-assistant-rehearsal-registry >/dev/null 2>&1 || true
          rm -rf /tmp/money-assistant-production-smoke
