name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: '5432'
  DB_DATABASE: testing
  DB_USERNAME: sail
  DB_PASSWORD: password

jobs:
  ci:
    runs-on: ubuntu-latest
    needs: [checks, browser]
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Configure application
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate application key
        run: php artisan key:generate --force --no-interaction

      - name: Run fresh PostgreSQL migrations
        run: php artisan migrate:fresh --force --no-interaction

      - name: Build frontend assets
        run: pnpm run build

      - name: Run feature Pest suite
        run: php artisan test --compact tests/Feature

      - name: Run Pint
        run: vendor/bin/pint --test --format agent

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run TypeScript checks
        run: pnpm run types:check

      - name: Run ESLint
        run: pnpm run lint:check

      - name: Run Prettier
        run: pnpm run format:check

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Configure application
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate application key
        run: php artisan key:generate --force --no-interaction

      - name: Build frontend assets
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run browser Pest suite
        run: php artisan test --compact --parallel --processes=2 tests/Browser

  production-stack:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Configure application
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate --force --no-interaction

      - name: Run focused infrastructure tests
        run: php artisan test --compact tests/Feature/Infrastructure/ProductionStackTest.php tests/Feature/Infrastructure/BackupRecoveryTest.php
